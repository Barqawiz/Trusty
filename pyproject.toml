[project]
name = "trusty"
version = "0.1.0"
description = "Privacy-first local voice assistant for Raspberry Pi 5 (Gemma 4 + llama.cpp)"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Trusty" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "websockets>=13.1",
    "soundfile>=0.12.1",
    "sounddevice>=0.5.1",
    "numpy>=1.26,<3",
    "kokoro-onnx>=0.4.7",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.20.0",
    "huggingface_hub[cli]>=0.26.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "voice*", "tools*"]
